
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Grade 12 Exam Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    header {
      background: #123b70;
      color: white;
      padding: 20px;
      border-radius: 10px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
    }
    input, button {
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #123b70;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #dashboard { display: none; }
  </style>
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <p>Admin Dashboard</p>
</header>

<section class="card" id="loginSection">
  <h3>Admin Login</h3>
  <form id="loginForm">
    <input id="username" placeholder="Username" required>
    <input id="password" type="password"
      placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p id="message"></p>
</section>

<section id="dashboard">
  <div class="card">
    <h2>Welcome Admin</h2>
    <button onclick="logout()">Logout</button>
  </div>
<div class="card">
  <h3>Student Management</h3>

  <h4>Total Students: <span id="totalStudents">0</span></h4>

  <input
    type="text"
    id="studentSearch"
    placeholder="Search by Student ID, Name or Email"
    oninput="searchStudents()"
  >

  <button onclick="loadStudents()">
    View All Students
  </button>

  <button onclick="exportStudentsCSV()">
    Export Students CSV
  </button>

  <div id="studentsList"></div>
</div>
  <div class="card">
  <h3>Exam Management</h3>

  <button onclick="loadExams()">View Exams</button>
  <button onclick="showCreateExam()">Create New Exam</button>

  <div id="createExamForm" style="display:none;">
    <h3>Create New Exam</h3>

    <form id="examForm">
      <input type="text" id="examTitle"
        placeholder="Exam Title" required>

      <input type="text" id="courseName"
        placeholder="Course Name" required>

      <input type="number" id="examDuration"
        placeholder="Duration in minutes" min="1" required>

      <button type="submit">Save Exam</button>
    </form>

    <p id="examMessage"></p>
  </div>

  <hr>
<button type="button"
onclick="document.getElementById('addQuestionSection').style.display='block'">
  + Add New Question
</button>

<div id="addQuestionSection" style="display:none;">
  <h3>Add Questions</h3>

  <form id="questionForm">
    <select id="questionExam" required>
      <option value="">Select Exam</option>
    </select>

<hr>
<h3>Bulk Upload Questions (Up to 100)</h3>

<label>Select Exam</label>
<select id="bulkExamSelect" required>
  <option value="">Select Exam</option>
</select>

<label>Upload CSV File</label>
<input
  type="file"
  id="questionsCSV"
  accept=".csv"
>

<button type="button" onclick="uploadBulkQuestions()">
  Upload Questions
</button>

<p id="bulkMessage"></p>


    <textarea id="questionText"
      placeholder="Write your question"
      required></textarea>

    <input id="optionA" placeholder="Option A" required>
    <input id="optionB" placeholder="Option B" required>
    <input id="optionC" placeholder="Option C" required>
    <input id="optionD" placeholder="Option D" required>

    <select id="correctAnswer" required>
      <option value="">Select Correct Answer</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>

    <input type="number" id="questionMarks"
      value="1" min="1" required>

    <button type="submit">Save Question</button>
  </form>

  <p id="questionMessage"></p>
</div>
<hr>
<h3>Add Multiple Questions (1–100)</h3>

<form id="multipleQuestionForm">

  <label>Select Exam</label>
  <select id="multiQuestionExam" required>
    <option value="">Select Exam</option>
  </select>

  <div id="multipleQuestions"></div>

  <button type="button" onclick="addAnotherQuestion()">
    + Add Another Question
  </button>

  <button type="submit">
    Save All Questions
  </button>

  <p id="multipleQuestionMessage"></p>

</form>

  <div id="examsList"></div>
    
<hr>
<h3>Manage Exam Questions</h3>

<div id="adminQuestionsList">
  Select an exam to view its questions.
</div>

</div>
  

  <div class="card">
    <h3>Exam Results</h3>
   <button onclick="exportResultsCSV()">
  Export Results to CSV
</button> 
    <button onclick="loadResults()">View Results</button>
    <div id="resultsList"></div>
  </div>
</section>
<script src="admin.js?v=3"></script>
</body>
</html>
