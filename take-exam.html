
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Exam | Grade 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <a href="dashboard.html">Dashboard</a>
</header>

<main class="container">
  <h1 id="examTitle">Loading Exam...</h1>
  <p id="timer">Time: --:--</p>

  <form id="examForm">
    <div id="questions"></div>
    <button type="submit" id="submitBtn">Submit Exam</button>
  </form>

  <p id="message"></p>
</main>

<script>
const API = "https://grade12-exam-backend.onrender.com";
const token = sessionStorage.getItem("studentToken");
const examId = new URLSearchParams(location.search).get("id");

const questionsBox = document.getElementById("questions");
const message = document.getElementById("message");

let remainingSeconds = 0;
let timerInterval;

if (!token) {
  location.href = "login.html";
}

if (!examId) {
  message.textContent = "Exam ID is missing.";
} else {
  loadExam();
}

async function loadExam() {
  try {
    const response = await fetch(
      API + "/api/exams/" + encodeURIComponent(examId) + "/questions"
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Could not load exam");
    }

    document.getElementById("examTitle").textContent =
      data.exam.title;

    if (!data.questions || data.questions.length === 0) {
      questionsBox.textContent = "No questions available.";
      return;
    }

    remainingSeconds = data.exam.duration_minutes * 60;

    data.questions.forEach((q, index) => {
      const card = document.createElement("div");
      card.className = "card";

      const heading = document.createElement("h3");
      heading.textContent =
        (index + 1) + ". " + q.question_text;

      card.appendChild(heading);

      ["A", "B", "C", "D"].forEach(letter => {
        const label = document.createElement("label");
        const radio = document.createElement("input");

        radio.type = "radio";
        radio.name = q.id;
        radio.value = letter;

        label.append(
          radio,
          document.createTextNode(
            " " + letter + ". " + q["option_" + letter.toLowerCase()]
          )
        );

        card.appendChild(label);
        card.appendChild(document.createElement("br"));
      });

      questionsBox.appendChild(card);
    });

    startTimer();

  } catch (error) {
    message.textContent = error.message;
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    remainingSeconds--;

    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    document.getElementById("timer").textContent =
      "Time: " + minutes + ":" + String(seconds).padStart(2, "0");

    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      document.getElementById("submitBtn").disabled = true;
      message.textContent = "Time is over.";
    }
  }, 1000);
 }
 document.getElementById("examForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const submitBtn = document.getElementById("submitBtn");
  message.textContent = "Submitting exam...";
  submitBtn.disabled = true;

  try {
    const answers = [];

    document.querySelectorAll('input[type="radio"]:checked').forEach(input => {
      answers.push({
        question_id: input.name,
        answer: input.value
      });
    });

    const token = sessionStorage.getItem("studentToken");

    if (!token) {
      throw new Error("Please login again.");
    }

    const response = await fetch(
      API + "/api/exams/" + encodeURIComponent(examId) + "/submit",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ answers })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || "Submission failed");
    }

    clearInterval(timerInterval);

    message.textContent =
      "Exam submitted successfully! Your score: " +
      result.score + " / " + result.total_marks;

  } catch (error) {
    message.textContent = error.message;
    submitBtn.disabled = false;
  }
}); 
</script>

</body>
</html>
