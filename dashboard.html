
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>Grade 12 Exam Portal</h2>
  </header>

  <main class="container">
    <h1>Student Dashboard</h1>

    <div class="card">
      <h2>Welcome, <span id="studentName">Student</span>!</h2>
      <p>You are successfully logged in.</p>
    </div>

<div class="card">
  <h3>My Learning</h3>
  <p><a href="exams.html">My Exams</a></p>
</div>

<div class="card">
  <h2>My Exam Results</h2>
  <div id="studentResults">
    Loading results...
  </div>
</div>
    <button id="logoutBtn">Logout</button>
    <p id="message"></p>
  </main>
<script>
  const token = sessionStorage.getItem("studentToken");
  const name = sessionStorage.getItem("studentName");

  const API = "https://grade12-exam-backend.onrender.com";

  if (!token) {
    window.location.href = "login.html";
  }

  document.getElementById("studentName").textContent =
    name || "Student";

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem("studentToken");
    sessionStorage.removeItem("studentName");
    window.location.href = "login.html";
  });

  async function loadStudentResults() {
  const resultsList = document.getElementById("studentResults");

  resultsList.textContent = "Loading results...";

  try {
    const response = await fetch(API + "/api/student/results", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const results = await response.json();

    if (!response.ok) {
      throw new Error(results.message || "Could not load results");
    }

    resultsList.innerHTML = "";

    if (results.length === 0) {
      resultsList.textContent = "No exam results available yet.";
      return;
    }

    results.forEach(result => {
      const card = document.createElement("div");
      card.className = "card";

      const subject = document.createElement("h3");
      subject.textContent = result.subject || "General";

      const title = document.createElement("p");
      title.textContent = "Exam: " + result.exam_title;

      const score = document.createElement("p");

      if (result.results_published) {
        score.textContent =
          "Your Score: " + result.score + " / " + result.total_marks;
      } else {
        score.textContent = "Results not published yet.";
      }

      card.append(subject, title, score);
      resultsList.appendChild(card);
    });

  } catch (error) {
    resultsList.textContent = error.message;
  }
}

loadStudentResults();
</script>


</body>
</html>
