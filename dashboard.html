
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
@media print {
  body {
    background: white !important;
  }

  body * {
    visibility: hidden;
  }

  #studentResults,
  #studentResults * {
    visibility: visible;
  }

  #studentResults {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    padding: 20px;
    color: black;
    background: white;
  }

  button {
    display: none !important;
  }
}

#studentResults {
  border: 2px solid #1e3a8a;
  padding: 20px;
  border-radius: 10px;
  background: white;
  color: #222;
}

#studentResults table {
  border-collapse: collapse;
  margin-top: 15px;
}

#studentResults th,
#studentResults td {
  border: 1px solid #333;
  padding: 10px;
  text-align: left;
}

#studentResults h3 {
  color: #1e3a8a;
}
</style>
</head>
<body>

  <header>
    <h2>Grade 12 Exam Portal</h2>
  </header>

  <main class="container">
    <h1>Student Dashboard</h1>

    <div class="card">
      <h2>Welcome, <span id="studentName">Student</span>!</h2>
      <p>You are successfully logged in.</p>
    </div>

<div class="card">
  <h3>My Learning</h3>
  <p><a href="exams.html">My Exams</a></p>
</div>

<div class="card">
  <h2>My Exam Results</h2>
  <div class="card">
  <h3>My Academic Summary</h3>
  <p id="totalScore">Total Score: --</p>
  <p id="averageScore">Average: --</p>
  <p id="completedExams">Completed Exams: --</p>
</div>
  <div id="studentResults">
    Loading results...
  </div>
  <button onclick="downloadReportCard()">
  Download Report Card PDF
</button>
</div>
    <button id="logoutBtn">Logout</button>
    <p id="message"></p>
  </main>
<script>
  const token = sessionStorage.getItem("studentToken");
  const name = sessionStorage.getItem("studentName");

  const API = "https://grade12-exam-backend.onrender.com";

  if (!token) {
    window.location.href = "login.html";
  }

  document.getElementById("studentName").textContent =
    name || "Student";

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem("studentToken");
    sessionStorage.removeItem("studentName");
    window.location.href = "login.html";
  });

  
async function loadStudentResults() {
  const resultsList = document.getElementById("studentResults");

  resultsList.textContent = "Loading results...";

  try {
    const response = await fetch(API + "/api/student/results", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const results = await response.json();

    if (!response.ok) {
      throw new Error(results.message || "Could not load results");
    }

    resultsList.innerHTML = "";

    const publishedResults = results.filter(
      result => result.results_published
    );

    if (publishedResults.length === 0) {
      resultsList.textContent = "No published results available yet.";
      return;
    }
const academyTitle = document.createElement("h2");
academyTitle.textContent = "GRADE 12 EXAM PORTAL";
academyTitle.style.textAlign = "center";
academyTitle.style.color = "#1e3a8a";

const reportTitle = document.createElement("h3");
reportTitle.textContent = "OFFICIAL STUDENT REPORT CARD";
reportTitle.style.textAlign = "center";

resultsList.append(academyTitle, reportTitle);
    // Student Information
    const studentInfo = document.createElement("div");
    studentInfo.className = "card";
    studentInfo.style.border = "1px solid #1e3a8a";
studentInfo.style.padding = "15px";
studentInfo.style.marginTop = "20px";

    const infoTitle = document.createElement("h3");
    infoTitle.textContent = "Student Information";

    const studentId = document.createElement("p");
studentId.textContent = "Student ID: " +
  (sessionStorage.getItem("studentId") || "Your Student ID");

const studentName = document.createElement("p");
studentName.textContent = "Name: " +
  (sessionStorage.getItem("studentName") || "Student");
    studentInfo.append(infoTitle, studentId, studentName);
    resultsList.appendChild(studentInfo);

    // Subject Results Table
    const heading = document.createElement("h3");
    heading.textContent = "Subject Results";
    resultsList.appendChild(heading);

    const table = document.createElement("table");
    table.style.width = "100%";
    table.border = "1";

    const header = table.insertRow();
    header.insertCell().textContent = "Subject";
    header.insertCell().textContent = "Score";

    let totalScore = 0;
    let totalMarks = 0;

    publishedResults.forEach(result => {
      const row = table.insertRow();

      row.insertCell().textContent = result.subject || "General";
      row.insertCell().textContent =
        result.score + "/" + result.total_marks;

      totalScore += Number(result.score || 0);
      totalMarks += Number(result.total_marks || 0);
    });

    resultsList.appendChild(table);

    // Total and Average
    const total = document.createElement("h3");
    total.textContent = "Total: " + totalScore + "/" + totalMarks;

    const average = totalMarks > 0
      ? (totalScore / totalMarks) * 100
      : 0;

    const averageText = document.createElement("h3");
    averageText.textContent = "Average: " + average.toFixed(2) + "%";

    resultsList.append(total, averageText);

    document.getElementById("totalScore").textContent =
      "Total Score: " + totalScore + "/" + totalMarks;

    document.getElementById("averageScore").textContent =
      "Average: " + average.toFixed(2) + "%";

    document.getElementById("completedExams").textContent =
      "Completed Exams: " + publishedResults.length;

  } catch (error) {
    resultsList.textContent = error.message;
  }
}

loadStudentResults();
function downloadReportCard() {
  window.print();
}
</script>


</body>
</html>
