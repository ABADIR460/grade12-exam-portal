
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Grade 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <a href="index.html" style="color:white;">Home</a>
</header>

<section class="hero">
  <h1>Student Login</h1>
  <p>Login to Your Examination Account</p>
</section>

<section style="max-width:450px;margin:40px auto;padding:25px;background:white;border-radius:12px;">

<form id="loginForm">

  <label>Student ID</label>
  <input type="text" id="studentId"
    placeholder="Enter Student ID" required>

  <br><br>

  <label>Password</label>
  <input type="password" id="password"
    placeholder="Enter Password" required>

  <br><br>

  <button type="submit" class="btn" id="loginBtn">
    Login
  </button>

  <p id="message"></p>

  <p>New student? <a href="register.html">Register Here</a></p>

</form>
</section>

<footer>
  <p>© 2026 Grade 12 Exam Portal</p>
</footer>

<script>
const API = "https://grade12-exam-backend.onrender.com";

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const message = document.getElementById("message");
  const button = document.getElementById("loginBtn");

  button.disabled = true;
  message.textContent = "Please wait...";

  try {

    const response = await fetch(API + "/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        student_id: document.getElementById("studentId").value.trim(),
        password: document.getElementById("password").value
      })
    });

    
const data = await response.json();

if (!response.ok) {
  throw new Error(data.message || "Login failed");
}

sessionStorage.setItem("studentToken", data.token);
sessionStorage.setItem("studentName", data.student.full_name);
sessionStorage.setItem("studentId", data.student.student_id);
message.style.color = "green";
message.textContent = "Login successful!";

setTimeout(() => {
  window.location.href = "dashboard.html";
}, 1000);

} catch (error) {
  message.style.color = "red";
  message.textContent = error.message;
} finally {
  button.disabled = false;
}
});

</script>

</body>
</html>
