
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Grade 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <a href="index.html" style="color:white;">Home</a>
</header>

<section class="hero">
  <h1>Student Login</h1>
  <p>Login to access your examination portal.</p>
</section>

<section style="max-width:400px;margin:40px auto;padding:25px;background:white;border-radius:12px;">
  <form id="loginForm">
    <label>Student ID</label>
    <input type="text" id="studentId" placeholder="Enter Student ID" required>

    <br><br>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password" required>

    <br><br>

    <button type="submit" class="btn">Login</button>
    <p id="message"></p>
  </form>
</section>

<footer>
  <p>© 2026 Grade 12 Exam Portal</p>
</footer>

</body>
</html>
