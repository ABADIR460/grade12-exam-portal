
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <a href="index.html" style="color:white;">Home</a>
</header>

<section class="hero">
  <h1>Student Registration</h1>
  <p>Create Your Student Account</p>
</section>

<section style="max-width:450px;margin:40px auto;padding:25px;background:white;border-radius:12px;">

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter Full Name" required>

<br><br>

<label>Student ID</label>
<input type="text" id="studentId" placeholder="Enter Student ID" required>

<br><br>

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>

<br><br>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter Phone Number" required>

<br><br>

<label>Password</label>
<input type="password" id="password" placeholder="Create Password" required>

<br><br>

<button type="submit" class="btn">Register</button>

<p id="message"></p>

</form>
</section>

<footer>
<p>© 2026 Grade 12 Exam Portal</p>
</footer>

</body>
</html>
