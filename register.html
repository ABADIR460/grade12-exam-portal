
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Grade 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Grade 12 Exam Portal</h2>
  <a href="index.html" style="color:white;">Home</a>
</header>

<section class="hero">
  <h1>Student Registration</h1>
  <p>Create Your Student Account</p>
</section>

<section style="max-width:450px;margin:40px auto;padding:25px;background:white;border-radius:12px;">

<form id="registerForm">

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Enter Full Name" required>

  <br><br>

  <label>Student ID</label>
  <input type="text" id="studentId" placeholder="Enter Student ID" required>

  <br><br>

  <label>Email</label>
  <input type="email" id="email" placeholder="Enter Email" required>

  <br><br>

  <label>Phone Number</label>
  <input type="tel" id="phone" placeholder="Enter Phone Number">

  <br><br>

  <label>Password</label>
  <input type="password" id="password" minlength="8" placeholder="Minimum 8 characters" required>

  <br><br>

  <button type="submit" class="btn" id="registerBtn">
    Register
  </button>

  <p id="message"></p>

  <p>Already registered? <a href="login.html">Login</a></p>

</form>
</section>

<footer>
  <p>© 2026 Grade 12 Exam Portal</p>
</footer>

<script>
const API = "https://grade12-exam-backend.onrender.com";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  message.textContent = "Please wait...";
  button.disabled = true;

  const student = {
    full_name: document.getElementById("name").value.trim(),
    student_id: document.getElementById("studentId").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    password: document.getElementById("password").value
  };

  try {
    const response = await fetch(API + "/api/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(student)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || "Registration failed");
    }

    message.textContent = "Registration successful!";
    message.style.color = "green";
    form.reset();

  } catch (error) {
    message.textContent = error.message;
    message.style.color = "red";
  }

  button.disabled = false;
});
</script>

</body>
</html>
